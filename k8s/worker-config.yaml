# Non-secret worker configuration. Credentials are NOT here: see the aws-credentials Secret in the README.
# The endpoint/URLs below target the local moto emulator running in Docker on the host.
# For real AWS: delete AWS_ENDPOINT_URL and S3_FORCE_PATH_STYLE, and set the real queue URLs and bucket.
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://host.docker.internal:5000
  S3_FORCE_PATH_STYLE: "true"
  S3_BUCKET: remoteward-uploads
  SQS_QUEUE_URL: http://host.docker.internal:5000/123456789012/remoteward-uploads
  SQS_DLQ_URL: http://host.docker.internal:5000/123456789012/remoteward-uploads-dlq
  SQS_VISIBILITY_TIMEOUT_SECONDS: "120"
  SQS_MAX_RECEIVE_COUNT: "3"
  REDIS_URL: redis://redis:6379
  JOB_STATUS_TTL_SECONDS: "86400"
  JOB_RESULT_TTL_SECONDS: "86400"
  JOB_LOCK_TTL_SECONDS: "60"
  WORKER_CONCURRENCY: "2"
  WORKER_SHUTDOWN_TIMEOUT_MS: "30000"
  WORKER_HEALTH_PORT: "8080"


